<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Something broke · Unruly Labs LP</title>
  <meta name="description" content="The server hit an error. We're looking at it. Try again, or email ops directly." />
  <meta name="theme-color" content="#0a2540" />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400&display=swap" />
  <style>
    :root {
      --navy: #0a2540;
      --navy-deep: #061a2f;
      --accent: #ff7a00;
      --accent-hot: #ff5a1f;
      --ash: #5a6b7b;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body, h1, p { margin: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: radial-gradient(120% 80% at 50% 0%, #0f2c4d 0%, #0a2540 45%, #061a2f 100%);
      color: #f4f6fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: left;
    }
    .wrap {
      max-width: 36rem;
      width: 100%;
    }
    .code {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
    }
    h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 700;
      font-size: clamp(2.2rem, 5.2vw, 3.6rem);
      letter-spacing: -0.035em;
      line-height: 1.05;
      margin-top: 0.6rem;
    }
    p.lead {
      color: rgba(255,255,255,0.78);
      font-size: 1.05rem;
      line-height: 1.6;
      margin-top: 1.2rem;
    }
    .actions {
      margin-top: 2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1.6rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.9rem 1.5rem;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      transition: background .15s ease, transform .12s ease;
    }
    .btn:hover { background: var(--accent-hot); transform: translateY(-2px); }
    .link {
      color: rgba(255,255,255,0.82);
      font-weight: 500;
      font-size: 0.95rem;
      border-bottom: 1px solid rgba(255,255,255,0.22);
      padding-bottom: 2px;
      text-decoration: none;
    }
    .link:hover { color: #fff; border-color: var(--accent); }
    .meta {
      margin-top: 3rem;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.42);
    }
    .meta a { color: rgba(255,255,255,0.6); text-decoration: underline; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="code">500 · Something broke</div>
    <h1>The server hit an error on this request.</h1>
    <p class="lead">
      We're looking at it. Try the request again in a moment, or email ops directly and we'll route a human. Either way, you didn't do anything wrong.
    </p>
    <div class="actions">
      <a href="/" class="btn">Back to home</a>
      <a href="mailto:ops@unrulylabslp.com?subject=Site%20error%20report" class="link">Email ops &rarr;</a>
    </div>
    <div class="meta">
      Unruly Labs LP &middot; <a href="mailto:ops@unrulylabslp.com">ops@unrulylabslp.com</a>
    </div>
  </main>
</body>
</html>
