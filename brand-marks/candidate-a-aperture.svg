  <path d="M 32 56 L 8 32 L 26 32 L 32 38 Z" fill="#0a2540"/>
  <path d="M 8 32 L 32 8 L 32 26 L 26 32 Z" fill="#0a2540"/>
  <!-- Center pupil · accent dot -->
  <rect x="29" y="29" width="6" height="6" fill="#ff7a00"/>
</svg>
