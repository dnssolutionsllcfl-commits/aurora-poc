<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Unruly Labs LP. AI-native infrastructure for operating businesses.">
  <title>Unruly Labs LP. AI-native infrastructure for operating businesses.</title>
  <desc>Open Graph card for Unruly Labs LP. AI-native infrastructure for operating businesses. Run leaner, ship faster, and put AI to work where it pays.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2c4d"/>
      <stop offset="55%" stop-color="#0a2540"/>
      <stop offset="100%" stop-color="#061a2f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#ff7a00" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ff7a00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7a00"/>
      <stop offset="60%" stop-color="#ff9c3d"/>
      <stop offset="100%" stop-color="#ffd58a"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Top-left brand mark (Candidate B Chevron-stack) -->
  <g transform="translate(72, 48)">
    <rect x="4" y="4" width="56" height="56" rx="10" fill="#0a2540"/>
    <path d="M 14 38 L 26 26 L 38 38" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.35"/>
    <path d="M 20 42 L 32 30 L 44 42" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.65"/>
    <path d="M 26 46 L 38 34 L 50 46" fill="none" stroke="#ff7a00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="76" y="40" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
          font-size="22" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Unruly Labs LP</text>
  </g>

  <!-- Eyebrow -->
  <g transform="translate(72, 152)">
    <rect x="0" y="0" width="380" height="32" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.18"/>
    <circle cx="20" cy="16" r="4" fill="#ff7a00"/>
    <text x="36" y="21" font-family="Inter, system-ui, sans-serif"
          font-size="12" font-weight="600" fill="#ffffff" fill-opacity="0.78" letter-spacing="2">COMPOUND OPERATING COMPANY</text>
  </g>

  <!-- Headline -->
  <g font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
     font-weight="800" letter-spacing="-2.5">
    <text x="72" y="276" font-size="72" fill="#f4f6fa">
      <tspan fill="url(#accent)">AI-native</tspan> infrastructure
    </text>
    <text x="72" y="360" font-size="72" fill="#f4f6fa">for operating businesses.</text>
  </g>

  <!-- Sub-head -->
  <g font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="500" fill="#ffffff" fill-opacity="0.78">
    <text x="72" y="444">Run leaner, ship faster, and put AI</text>
    <text x="72" y="482">to work where it pays.</text>
  </g>

  <!-- Footer rule -->
  <rect x="72" y="528" width="1056" height="1" fill="url(#line)"/>

  <!-- Footer row -->
  <g font-family="Inter, system-ui, sans-serif" font-size="18" fill="#ffffff" fill-opacity="0.62">
    <text x="72" y="568" font-weight="500">Operator-led. Scope locked at the audit.</text>
    <text x="1128" y="568" text-anchor="end" font-weight="600" fill="#ff7a00" fill-opacity="1">unrulylabslp.com</text>
  </g>
</svg>
